# Alembic configuration for Stock-Prediction
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts folder
script_location = migrations

# Path prepended to sys.path
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Max length of characters to apply to the slug field in generated revision filenames
truncate_slug_length = 40

# Version path separator ("os" uses os.pathsep)
version_path_separator = os

# Output encoding used when revision scripts are generated
output_encoding = utf-8

# Database URL: Default / fallback connection string.
# Dynamically overridden by migrations/env.py using DATABASE_URL from .env
sqlalchemy.url = postgresql+psycopg://stockpred:stockpred@localhost:5432/stockpred


[post_write_hooks]
# Post-write hooks for revision generation (e.g. ruff, black)


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
